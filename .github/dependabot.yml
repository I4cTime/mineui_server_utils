version: 2
updates:
  # Keep GitHub Actions current. The check-action-versions job in build.yml is
  # the fallback for anything Dependabot doesn't (or can't) open a PR for.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Gradle plugins and Java dependencies (ForgeGradle, Foojay, slf4j, paper-api).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # Batch routine minor/patch bumps; majors open as individual PRs so
      # they get scrutiny instead of riding along with routine updates (this
      # is how the FG7 + Gradle 9 combo slipped through as one grouped PR).
      gradle:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # MC 1.20.1 Forge mods are built against ForgeGradle 6.x. FG7 removed
      # copyIdeResources and other APIs this build relies on -- staying on
      # 6.x is deliberate, not lag. Revisit only alongside a MC/Forge target
      # bump.
      - dependency-name: "net.minecraftforge.gradle"
        update-types: ["version-update:semver-major"]
      # Gradle 9 turns this project's `by project` delegate usage into a
      # build error, and the documented MC 1.20.1 Forge toolchain is Gradle
      # 8.x. "gradle" is Dependabot's dependency name for the wrapper
      # (gradle-wrapper.properties distributionUrl) under the gradle
      # ecosystem.
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
